<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <div class="login" id="login-page">
        <div class="login_content">
            <img src="login.avif" alt="Login Image">
        </div>
        <div class="login_forms">
            <form class="login_registre block" id="login-in">
                <h1 class="login_title">Sign In</h1>
                <div class="login_box">
                    <i class="fa-solid fa-user login_icon"></i>
                    <input type="text" placeholder="Username" class="login_input" id="login-username">
                </div>
                <div class="login_box">
                    <i class="fa-solid fa-lock login_icon"></i>
                    <input type="password" placeholder="Password" class="login_input" id="login-password">
                </div>
                <a href="#" class="login_forgot">Forgot Password?</a>
                <a href="#" class="login_button" id="signInBtn">Sign In</a>
                <div>
                    <span class="login_account">Don't have an Account?</span>
                    <span class="login_signin" id="sign-up">Sign up</span>
                </div>
            </form>
            <form class="login_create none" id="login-up">
                <h1 class="login_title">Create Account</h1>
                <div class="login_box">
                    <i class="fa-solid fa-user login_icon"></i>
                    <input type="text" placeholder="Username" class="login_input" id="signup-username">
                </div>
                <div class="login_box">
                    <i class="fa-solid fa-at login_icon"></i>
                    <input type="email" placeholder="Email" class="login_input" id="signup-email">
                </div>
                <div class="login_box">
                    <i class="fa-solid fa-lock login_icon"></i>
                    <input type="password" placeholder="Password" class="login_input" id="signup-password">
                </div>
                <a href="#" class="login_button" id="signUpBtn">Sign up</a>
                <div>
                    <span class="login_account">Already have an Account?</span>
                    <span class="login_signup" id="sign-in">Sign In</span>
                </div>
            </form>
        </div>
    </div>

    <div class="dashboard none" id="dashboard-page">
        <h1>Welcome to the Dashboard</h1>
        <button id="logout">Log Out</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
